/* IconBox — molecule. An Icon inside a styled container: style × size × radius × tone.
   The glyph is sized by CONTEXT (--es-icon-size), never by styling .es-icon directly.
   A parent can set --es-icon-box-size / --es-icon-box-radius to restyle every box inside it
   (ContactInfo does). An explicit data-size / data-radius on the box wins over that context. */

.es-icon-box {
  /* tone (default: primary) */
  --_solid: var(--es-primary-bg);
  --_on-solid: var(--es-primary-text-inverted);
  --_soft: var(--es-primary-soft);
  --_ink: var(--es-primary-text);
  --_line: var(--es-primary-strong);

  /* style (default: fill) */
  --_bg: var(--_solid);
  --_fg: var(--_on-solid);
  --_bd: transparent;

  /* geometry (default: md, soft) */
  --_box: var(--es-icon-box-size, var(--es-space-500));
  --_radius: var(--es-icon-box-radius, var(--es-radius-medium));

  /* hand the glyph size down as context: half the box (32 -> 16, 40 -> 20, 48 -> 24) */
  --es-icon-size: calc(var(--_box) / 2);

  box-sizing: border-box;
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  inline-size: var(--_box);
  block-size: var(--_box);
  border: var(--es-border-width-thin) solid var(--_bd);
  border-radius: var(--_radius);
  background-color: var(--_bg);
  color: var(--_fg);
}

/* ---- style ---- */
.es-icon-box[data-style="fill"]    { --_bg: var(--_solid); --_fg: var(--_on-solid); --_bd: transparent; }
.es-icon-box[data-style="outline"] { --_bg: transparent;   --_fg: var(--_ink);      --_bd: var(--_line); }
.es-icon-box[data-style="soft"]    { --_bg: var(--_soft);  --_fg: var(--_ink);      --_bd: transparent; }
.es-icon-box[data-style="text"]    { --_bg: transparent;   --_fg: var(--_ink);      --_bd: transparent; }

/* ---- size ---- */
.es-icon-box[data-size="sm"] { --_box: var(--es-space-400); }
.es-icon-box[data-size="md"] { --_box: var(--es-space-500); }
.es-icon-box[data-size="lg"] { --_box: var(--es-space-600); }

/* ---- radius (3 choices over the 7-step scale) ---- */
.es-icon-box[data-radius="none"] { --_radius: 0; }
.es-icon-box[data-radius="soft"] { --_radius: var(--es-radius-medium); }
.es-icon-box[data-radius="full"] { --_radius: var(--es-radius-full); }

/* ---- tone ---- */
.es-icon-box[data-tone="secondary"] {
  --_solid: var(--es-secondary-bg); --_on-solid: var(--es-secondary-text-inverted);
  --_soft: var(--es-secondary-soft); --_ink: var(--es-secondary-text); --_line: var(--es-secondary-strong);
}
.es-icon-box[data-tone="neutral"] {
  /* soft uses neutral-surface: neutral-soft is nearly white and disappears on base-surface */
  --_solid: var(--es-neutral-bg); --_on-solid: var(--es-text-inverted);
  --_soft: var(--es-neutral-surface); --_ink: var(--es-neutral-text); --_line: var(--es-neutral-strong);
}
.es-icon-box[data-tone="success"] {
  --_solid: var(--es-success-bg); --_on-solid: var(--es-success-text-inverted);
  --_soft: var(--es-success-soft); --_ink: var(--es-success-text); --_line: var(--es-success-strong);
}
.es-icon-box[data-tone="warning"] {
  --_solid: var(--es-warning-bg); --_on-solid: var(--es-warning-text-inverted);
  --_soft: var(--es-warning-soft); --_ink: var(--es-warning-text); --_line: var(--es-warning-strong);
}
.es-icon-box[data-tone="error"] {
  --_solid: var(--es-error-bg); --_on-solid: var(--es-error-text-inverted);
  --_soft: var(--es-error-soft); --_ink: var(--es-error-text); --_line: var(--es-error-strong);
}

/* ContactInfo — organism. IconBox + label + value (phone, email, address, hours).
   It never restyles IconBox. It sets CONTEXT (--es-icon-box-size / -radius) and IconBox reads it,
   so every IconBox inside inherits the size and radius with zero markup changes.
   Context carries continuous values only. Variants (style, tone) are attributes, and attributes do not
   inherit — set those on each IconBox. */

.es-contact-info {
  /* context handed to the IconBox below (defaults: md, soft) */
  --es-icon-box-size: var(--es-space-500);
  --es-icon-box-radius: var(--es-radius-medium);

  display: flex;
  align-items: center;
  gap: var(--es-space-150);
  font-family: var(--es-font-text);
  color: var(--es-text-primary);
}

/* ---- size: container + type scale together ---- */
.es-contact-info[data-size="sm"] { --es-icon-box-size: var(--es-space-400); }
.es-contact-info[data-size="md"] { --es-icon-box-size: var(--es-space-500); }
.es-contact-info[data-size="lg"] { --es-icon-box-size: var(--es-space-600); }

/* ---- icon radius (passes straight through to every IconBox inside) ---- */
.es-contact-info[data-icon-radius="none"] { --es-icon-box-radius: 0; }
.es-contact-info[data-icon-radius="soft"] { --es-icon-box-radius: var(--es-radius-medium); }
.es-contact-info[data-icon-radius="full"] { --es-icon-box-radius: var(--es-radius-full); }

/* ---- layout ---- */
.es-contact-info[data-layout="stacked"] {
  flex-direction: column;
  gap: var(--es-space-100);
  text-align: center;
}

.es-contact-info__body {
  display: flex;
  flex-direction: column;
  gap: var(--es-space-025);
  min-inline-size: 0;
}

.es-contact-info__label {
  font-size: var(--es-text-size-xs);
  font-weight: var(--es-weight-semibold);
  line-height: var(--es-text-leading-tight);
  letter-spacing: var(--es-text-tracking-wide);
  color: var(--es-text-tertiary);
}

.es-contact-info__value {
  font-size: var(--es-text-size-md);
  font-weight: var(--es-weight-medium);
  line-height: var(--es-text-leading-normal);
  color: var(--es-text-primary);
  text-decoration: none;
  overflow-wrap: anywhere;
}
.es-contact-info[data-size="sm"] .es-contact-info__value { font-size: var(--es-text-size-sm); }
.es-contact-info[data-size="lg"] .es-contact-info__value { font-size: var(--es-text-size-lg); }

a.es-contact-info__value:hover { color: var(--es-link-hover); text-decoration: underline; }
a.es-contact-info__value:focus-visible {
  outline: var(--es-border-width-medium) solid var(--es-state-focus);
  outline-offset: var(--es-border-width-medium);
  border-radius: var(--es-radius-small);
}

/* Enspire Lab chrome. Lives in tools/, so it is not linted — but it still runs on the system's own tokens,
   which means switching theme / density / radius restyles the Lab itself. */

*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

body {
  margin: 0;
  background: var(--es-base-bg);
  color: var(--es-text-primary);
  font-family: var(--es-font-text);
  font-size: var(--es-text-size-md);
  line-height: var(--es-text-leading-normal);
}

button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--es-state-focus); outline-offset: 2px; }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

/* ---------- top bar ---------- */
.lab-bar {
  position: sticky; top: 0; z-index: 20;
  background: var(--es-base-surface);
  border-bottom: 1px solid var(--es-neutral-strong);
}
.lab-bar__inner {
  max-width: 1240px; margin: 0 auto; padding: 12px 16px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
}
.lab-brand { font-weight: 700; font-size: 1.125rem; letter-spacing: -0.01em; margin-right: auto; display: flex; align-items: baseline; gap: 8px; }
.lab-brand small { font-weight: 500; font-size: 0.75rem; color: var(--es-text-tertiary); }
.lab-ctl { display: flex; align-items: center; gap: 8px; max-width: 100%; min-width: 0; }
.lab-ctl .lab-seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.lab-ctl > span { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em; color: var(--es-text-tertiary); text-transform: uppercase; }

.lab-seg { display: inline-flex; border: 1px solid var(--es-neutral-strong); border-radius: 8px; overflow: hidden; background: var(--es-base-surface); }
.lab-seg button {
  flex: none; white-space: nowrap;
  border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 0.8125rem; font-weight: 500;
  border-right: 1px solid var(--es-neutral-strong);
}
.lab-seg button:last-child { border-right: 0; }
.lab-seg button:hover { background: var(--es-base-surface-hover); }
.lab-seg button[aria-pressed="true"] { background: var(--es-primary-bg); color: var(--es-primary-text-inverted); }

.lab-input, .lab-select {
  border: 1px solid var(--es-neutral-strong); border-radius: 8px; background: var(--es-base-surface);
  padding: 6px 10px; font-size: 0.8125rem;
}
.lab-input { min-width: 180px; }

/* ---------- page ---------- */
.lab-main { max-width: 1240px; margin: 0 auto; padding: 8px 16px 64px; }
.lab-nav { display: flex; gap: 8px; overflow-x: auto; padding: 16px 0 8px; scrollbar-width: thin; }
.lab-nav a {
  flex: none; text-decoration: none; font-size: 0.8125rem; font-weight: 500; color: var(--es-text-secondary);
  padding: 4px 12px; border-radius: 9999px; background: var(--es-base-surface); border: 1px solid var(--es-neutral-strong);
}
.lab-nav a:hover { background: var(--es-primary-surface); }

.lab-card {
  background: var(--es-base-surface); border: 1px solid var(--es-neutral-strong);
  border-radius: 12px; padding: 20px; margin: 20px 0;
  scroll-margin-top: 84px;
}
.lab-card__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
.lab-card h2 { margin: 0; font-size: 1.25rem; line-height: 1.25; letter-spacing: -0.01em; }
.lab-level { font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
.lab-level[data-level="atom"] { background: var(--es-secondary-soft); color: var(--es-secondary-text); }
.lab-level[data-level="molecule"] { background: var(--es-primary-soft); color: var(--es-primary-text); }
.lab-level[data-level="organism"] { background: var(--es-warning-soft); color: var(--es-warning-text); }
.lab-class { font-size: 0.8125rem; color: var(--es-text-tertiary); }
.lab-summary { margin: 6px 0 10px; color: var(--es-text-secondary); }
.lab-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; font-size: 0.75rem; }
.lab-chip { padding: 2px 8px; border-radius: 4px; background: var(--es-neutral-surface); color: var(--es-neutral-text); }
.lab-chip--uses { background: transparent; border: 1px dashed var(--es-neutral-strong); }

.lab-controls { display: flex; flex-wrap: wrap; gap: 10px 18px; padding: 12px 0; border-top: 1px solid var(--es-neutral-surface); }
.lab-axis { display: flex; align-items: center; gap: 8px; max-width: 100%; min-width: 0; }
.lab-axis .lab-seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.lab-axis > label, .lab-axis > span { font-size: 0.75rem; font-weight: 600; color: var(--es-text-tertiary); }

.lab-stage { background: var(--es-base-bg); border-radius: 8px; padding: 12px 16px; overflow-x: auto; }
.lab-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 16px; padding: 12px 0; }
.lab-row + .lab-row { border-top: 1px dashed var(--es-neutral-strong); }
.lab-rowlabel { flex: 0 0 100%; font-size: 0.75rem; font-weight: 600; color: var(--es-text-tertiary); }
.lab-cell { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.lab-cell figcaption { font-size: 0.6875rem; color: var(--es-text-tertiary); }

.lab-card details { margin-top: 12px; }
.lab-card summary { cursor: pointer; font-size: 0.8125rem; font-weight: 600; color: var(--es-text-secondary); }
.lab-card pre {
  margin: 8px 0 0; padding: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
  font-size: 0.75rem; line-height: 1.5; border-radius: 8px; background: var(--es-neutral-soft); color: var(--es-text-primary);
}
.lab-a11y { margin: 8px 0 0; font-size: 0.8125rem; color: var(--es-text-tertiary); }

/* ---------- personality compare ---------- */
.lab-compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
@media (max-width: 640px) { .lab-compare { grid-template-columns: 1fr; } }
.lab-quad { background: var(--es-base-bg); border: 1px solid var(--es-neutral-strong); border-radius: 8px; padding: 12px 16px; min-width: 0; overflow-x: auto; }
.lab-quad h3 { margin: 0 0 4px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.02em; color: var(--es-text-tertiary); text-transform: uppercase; }
.lab-empty { padding: 48px 0; text-align: center; color: var(--es-text-tertiary); }

</style>
</head>
<body>
<div id="app"></div>
<script>window.LAB = {"components":[{"name":"icon","class":"es-icon","level":"atom","summary":"A bare Lucide glyph drawn as a CSS mask. Takes currentColor. No container.","tags":["icon","glyph","svg","lucide","decorative"],"uses":[],"variants":{"size":["sm","md","lg"],"name":["arrow-left","arrow-right","building-2","calendar","check","chevron-down","chevron-left","chevron-right","chevron-up","circle-alert","circle-check","circle-x","clock","download","external-link","globe","heart","house","info","link","mail","map-pin","menu","message-circle","minus","phone","plus","quote","search","send","shield-check","star","triangle-alert","upload","user","users","x","zap"]},"defaults":{"size":"md","name":"mail"},"preview":"\u003cspan class=\"es-icon\" data-name=\"{name}\" data-size=\"{size}\" aria-hidden=\"true\">\u003c/span>","a11y":"Decorative by default: add aria-hidden=\"true\". If it carries meaning on its own, use role=\"img\" and aria-label. Never convey meaning by glyph alone."},{"name":"icon-box","class":"es-icon-box","level":"molecule","summary":"An Icon inside a styled container (fill, outline, soft or text) with size, radius and tone.","tags":["icon","container","badge","decorative","feature","avatar-like"],"uses":["icon"],"variants":{"style":["fill","outline","soft","text"],"size":["sm","md","lg"],"radius":["none","soft","full"],"tone":["primary","secondary","neutral","success","warning","error"]},"defaults":{"style":"fill","size":"md","radius":"soft","tone":"primary"},"preview":"\u003cspan class=\"es-icon-box\" data-style=\"{style}\" data-size=\"{size}\" data-radius=\"{radius}\" data-tone=\"{tone}\">\u003cspan class=\"es-icon\" data-name=\"mail\" aria-hidden=\"true\">\u003c/span>\u003c/span>","a11y":"Decorative by default; mark the inner icon aria-hidden. If the box alone carries meaning, give the box role=\"img\" and aria-label. Interactive version is IconButton (Faza 3), not this."},{"name":"contact-info","class":"es-contact-info","level":"organism","summary":"One contact line: icon container, small label, value (phone, email, address, hours).","tags":["contact","phone","email","address","footer","header","info","list-item"],"uses":["icon-box"],"variants":{"layout":["inline","stacked"],"size":["sm","md","lg"],"icon-radius":["none","soft","full"]},"defaults":{"layout":"inline","size":"md","icon-radius":"soft"},"preview":"\u003cdiv class=\"es-contact-info\" data-layout=\"{layout}\" data-size=\"{size}\" data-icon-radius=\"{icon-radius}\">\u003cspan class=\"es-icon-box\" data-style=\"soft\">\u003cspan class=\"es-icon\" data-name=\"phone\" aria-hidden=\"true\">\u003c/span>\u003c/span>\u003cdiv class=\"es-contact-info__body\">\u003cspan class=\"es-contact-info__label\">Call us\u003c/span>\u003ca class=\"es-contact-info__value\" href=\"tel:+37300000000\">+373 000 00 000\u003c/a>\u003c/div>\u003c/div>","a11y":"Icon is decorative (aria-hidden); the label and value carry the meaning. Make the value a real link for phone and email."}]};</script>
<script>
/* Enspire Lab — vanilla JS, no dependencies. Reads window.LAB (built from every meta.json). */
(() => {
  const DATA = window.LAB;
  const byName = Object.fromEntries(DATA.components.map((c) => [c.name, c]));

  // ---- tiny helpers ----
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = {
    get: (k, d) => { try { return localStorage.getItem('es-lab-' + k) || d; } catch (e) { return d; } },
    set: (k, v) => { try { localStorage.setItem('es-lab-' + k, v); } catch (e) { /* storage is a convenience only */ } },
  };
  const fill = (tpl, values) => tpl.replace(/\{([\w-]+)\}/g, (m, k) => (k in values ? values[k] : m));

  // ---- global look: theme x density x radius ----
  const DENSITY = { compact: 0.75, default: 1, comfortable: 1.25 };
  const RADIUS = { sharp: 0, soft: 1, round: 2 };
  const global = {
    theme: store.get('theme', 'auto'),
    density: store.get('density', 'default'),
    radius: store.get('radius', 'soft'),
  };
  function applyGlobal() {
    const root = document.documentElement;
    if (global.theme === 'auto') root.removeAttribute('data-theme'); else root.dataset.theme = global.theme;
    root.style.setProperty('--es-density', DENSITY[global.density]);
    root.style.setProperty('--es-radius-scale', RADIUS[global.radius]);
  }

  // ---- per-component state ----
  const state = {};
  function stateOf(c) {
    if (state[c.name]) return state[c.name];
    const axes = Object.keys(c.variants);
    const defaults = {};
    axes.forEach((a) => { defaults[a] = (c.defaults && c.defaults[a]) || c.variants[a][0]; });
    return (state[c.name] = { rows: axes[0] || '', cols: axes[1] || '', fixed: defaults, defaults });
  }
  const valuesFor = (c, s, extra) => ({ ...s.fixed, ...extra });
  const renderOne = (c, s, extra) => fill(c.preview, valuesFor(c, s, extra));

  function stage(c, s) {
    const rowVals = s.rows ? c.variants[s.rows] : [null];
    const colVals = s.cols ? c.variants[s.cols] : [null];
    const captions = colVals.length <= 8;
    return rowVals.map((r) => {
      const cells = colVals.map((v) => {
        const extra = {};
        if (s.rows) extra[s.rows] = r;
        if (s.cols) extra[s.cols] = v;
        const label = [s.rows && `${s.rows}=${r}`, s.cols && `${s.cols}=${v}`].filter(Boolean).join(' · ');
        return `<figure class="lab-cell" title="${esc(label)}">${renderOne(c, s, extra)}${captions && v ? `<figcaption>${esc(v)}</figcaption>` : ''}</figure>`;
      }).join('');
      return `<div class="lab-row">${s.rows ? `<div class="lab-rowlabel">${esc(s.rows)} = ${esc(r)}</div>` : ''}${cells}</div>`;
    }).join('');
  }

  function controls(c, s) {
    const axes = Object.keys(c.variants);
    const opt = (list, cur, none) => (none ? `<option value="">— none —</option>` : '') +
      list.map((a) => `<option value="${esc(a)}"${a === cur ? ' selected' : ''}>${esc(a)}</option>`).join('');
    let html = '';
    if (axes.length) {
      html += `<div class="lab-axis"><label>Rows</label><select class="lab-select" data-c="${c.name}" data-k="rows">${opt(axes, s.rows, true)}</select></div>`;
      html += `<div class="lab-axis"><label>Columns</label><select class="lab-select" data-c="${c.name}" data-k="cols">${opt(axes, s.cols, true)}</select></div>`;
    }
    axes.filter((a) => a !== s.rows && a !== s.cols).forEach((a) => {
      const vals = c.variants[a];
      html += `<div class="lab-axis"><span>${esc(a)}</span>` + (vals.length <= 6
        ? `<div class="lab-seg">${vals.map((v) => `<button type="button" aria-pressed="${s.fixed[a] === v}" data-c="${c.name}" data-fix="${esc(a)}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`
        : `<select class="lab-select" data-c="${c.name}" data-fix="${esc(a)}">${opt(vals, s.fixed[a], false)}</select>`) + `</div>`;
    });
    return html;
  }

  function card(c) {
    const s = stateOf(c);
    const sample = renderOne(c, s, {});
    return `<section class="lab-card" id="c-${c.name}" data-name="${c.name}">
      <div class="lab-card__head"><h2>${esc(c.name)}</h2><span class="lab-level" data-level="${c.level}">${c.level}</span><code class="lab-class">.${esc(c.class)}</code></div>
      <p class="lab-summary">${esc(c.summary)}</p>
      <div class="lab-meta">${(c.uses || []).map((u) => `<span class="lab-chip lab-chip--uses">uses ${esc(u)}</span>`).join('')}${(c.tags || []).map((t) => `<span class="lab-chip">${esc(t)}</span>`).join('')}</div>
      <div class="lab-controls" data-controls>${controls(c, s)}</div>
      <div class="lab-stage" data-stage>${stage(c, s)}</div>
      <details><summary>Markup (current defaults)</summary><pre data-markup>${esc(sample)}</pre></details>
      <p class="lab-a11y"><strong>A11y.</strong> ${esc(c.a11y || '')}</p>
    </section>`;
  }

  function refresh(name) {
    const c = byName[name], s = stateOf(c);
    const root = document.getElementById('c-' + name);
    root.querySelector('[data-controls]').innerHTML = controls(c, s);
    root.querySelector('[data-stage]').innerHTML = stage(c, s);
    root.querySelector('[data-markup]').textContent = renderOne(c, s, {});
  }

  // ---- personality compare: the same component under four looks at once ----
  const QUADS = [
    ['Sharp · compact', 0, 0.75], ['Round · compact', 2, 0.75],
    ['Sharp · comfortable', 0, 1.25], ['Round · comfortable', 2, 1.25],
  ];
  let compareName = store.get('compare', DATA.components.length ? DATA.components[DATA.components.length - 1].name : '');
  if (!byName[compareName]) compareName = DATA.components[0] && DATA.components[0].name;

  function compare() {
    const c = byName[compareName]; if (!c) return '';
    const s = stateOf(c);
    const first = s.rows;
    const rowVals = first ? c.variants[first].slice(0, 4) : [null];
    const inner = rowVals.map((r) => `<div class="lab-row">${renderOne(c, s, first ? { [first]: r } : {})}</div>`).join('');
    return `<section class="lab-card" id="compare">
      <div class="lab-card__head"><h2>Compare personalities</h2><code class="lab-class">data-es-scope</code></div>
      <p class="lab-summary">Same component, same markup, four looks. Each box sets only <code>--es-density</code> and <code>--es-radius-scale</code>.</p>
      <div class="lab-controls"><div class="lab-axis"><label for="cmp">Component</label>
        <select class="lab-select" id="cmp">${DATA.components.map((x) => `<option value="${x.name}"${x.name === compareName ? ' selected' : ''}>${x.name}</option>`).join('')}</select></div></div>
      <div class="lab-compare">${QUADS.map(([t, r, d]) =>
        `<div class="lab-quad" data-es-scope style="--es-radius-scale:${r};--es-density:${d}"><h3>${t}</h3>${inner}</div>`).join('')}</div>
    </section>`;
  }

  // ---- shell ----
  function seg(id, label, options, current) {
    return `<div class="lab-ctl"><span>${label}</span><div class="lab-seg" data-seg="${id}">${options.map((o) =>
      `<button type="button" data-v="${o}" aria-pressed="${o === current}">${o}</button>`).join('')}</div></div>`;
  }

  let query = '';
  function build() {
    const list = DATA.components.filter((c) => !query ||
      (c.name + ' ' + (c.tags || []).join(' ') + ' ' + c.summary).toLowerCase().includes(query));
    document.getElementById('app').innerHTML = `
      <header class="lab-bar"><div class="lab-bar__inner">
        <div class="lab-brand">Enspire Lab <small>${DATA.components.length} components</small></div>
        <input class="lab-input" id="q" type="search" placeholder="Search name, tag…" value="${esc(query)}" aria-label="Search components">
        ${seg('theme', 'Theme', ['auto', 'light', 'dark'], global.theme)}
        ${seg('density', 'Density', Object.keys(DENSITY), global.density)}
        ${seg('radius', 'Radius', Object.keys(RADIUS), global.radius)}
      </div></header>
      <main class="lab-main">
        <nav class="lab-nav" aria-label="Components">${list.map((c) => `<a href="#c-${c.name}">${c.name}</a>`).join('')}<a href="#compare">compare</a></nav>
        ${list.length ? list.map(card).join('') : '<p class="lab-empty">No component matches.</p>'}
        ${compare()}
      </main>`;
  }

  // ---- events (delegated, so re-rendering a card never loses them) ----
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const seg = b.closest('[data-seg]');
    if (seg) {
      global[seg.dataset.seg] = b.dataset.v; store.set(seg.dataset.seg, b.dataset.v); applyGlobal();
      seg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
      return;
    }
    if (b.dataset.fix) { stateOf(byName[b.dataset.c]).fixed[b.dataset.fix] = b.dataset.v; refresh(b.dataset.c); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'cmp') { compareName = t.value; store.set('compare', t.value); document.getElementById('compare').outerHTML = compare(); return; }
    if (!t.dataset.c) return;
    const s = stateOf(byName[t.dataset.c]);
    if (t.dataset.k) s[t.dataset.k] = t.value; else if (t.dataset.fix) s.fixed[t.dataset.fix] = t.value;
    refresh(t.dataset.c);
  });
  document.addEventListener('input', (e) => {
    if (e.target.id !== 'q') return;
    query = e.target.value.trim().toLowerCase();
    const pos = e.target.selectionStart; build(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos);
  });

  applyGlobal();
  build();
})();

</script>
</body>
